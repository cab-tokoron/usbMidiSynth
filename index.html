<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized SoundFont Synth for EWI</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1e1e24; color: #e0e0e0; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #4caf50; border-bottom: 2px solid #4caf50; padding-bottom: 10px; }
        .control-group { margin: 20px 0; background: #2a2a35; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="range"] { width: 100%; padding: 10px; background: #3a3a4a; color: #fff; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; }
        .status { padding: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; }
        .success { background: #1b5e20; color: #c8e6c9; }
        .error { background: #b71c1c; color: #ffcdd2; }
        .info { background: #0d47a1; color: #e3f2fd; }
        .file-input { background: #444; border: 2px dashed #666; padding: 20px; text-align: center; border-radius: 8px; width: 100%; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Web FluidSynth Engine for EWI</h1>
    <div id="status" class="status success">バッファ最適化・ブレス閾値カットオフ版エンジン準備完了。</div>

    <div class="control-group">
        <label>FluidR3_GM.sf2 の読み込み:</label>
        <input type="file" id="sf2-file" accept=".sf2" class="file-input">
    </div>

    <div class="control-group">
        <label for="instrument-select">楽器（プリセット）選定:</label>
        <select id="instrument-select" disabled>
            <option value="0">Prog 0: Acoustic Grand Piano</option>
            <option value="65">Prog 65: Alto Sax</option>
            <option value="66">Prog 66: Tenor Sax</option>
            <option value="68">Prog 68: Oboe</option>
            <option value="71">Prog 71: Clarinet</option>
            <option value="73">Prog 73: Flute</option>
            <option value="81">Prog 81: Saw Lead</option>
        </select>
    </div>

    <div class="control-group">
        <label for="transpose-select">移調 (Transpose):</label>
        <select id="transpose-select"></select>
    </div>

    <div class="control-group">
        <label for="volume-slider">マスターボリューム:</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        <span id="volume-val" style="float: right; margin-top: 5px;">70%</span>
    </div>

<script>
// ============================================================================
// SoundFont2 パース・コア
// ============================================================================
class SoundFontParser {
    constructor(arrayBuffer) {
        this.u8 = new Uint8Array(arrayBuffer);
        this.dv = new DataView(arrayBuffer);
        this.presets = {};
        this.parse();
    }
    parse() {
        if (this.dv.getUint32(0, false) !== 0x52494646) throw new Error("Not a valid SF2 file.");
        for (let i = 0; i < 128; i++) { this.presets[i] = { name: "Program " + i }; }
    }
}

// ============================================================================
// EWI最適化チューニング・シンセエンジン
// ============================================================================
class EWISoundFontEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.activeVoices = new Map();
        this.currentProgram = 0;
        this.masterVolume = 0.7;
        this.currentCc2 = 127;
        this.BREATH_THRESHOLD = 5; // ★ブレスのカットオフ閾値 (これ以下なら強制消音)
    }

    init(audioContext, arrayBuffer) {
        this.ctx = audioContext;
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(this.masterVolume, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
        this.sf2 = new SoundFontParser(arrayBuffer);
    }

    setVolume(vol) {
        this.masterVolume = vol;
        if (this.masterGain) this.masterGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.01);
    }

    setProgram(prog) {
        this.currentProgram = prog;
    }

    // 高速CC#2メッセージのバッファ・チューニング
    handleCC(ccNum, ccVal) {
        if (ccNum === 2 || ccNum === 11 || ccNum === 7) {
            this.currentCc2 = ccVal;

            // 【対策1】ユーザー提案のロジック：ブレス値が閾値以下なら、全ノートを即座に安全消音
            if (this.currentCc2 <= this.BREATH_THRESHOLD) {
                this.allNotesOff();
                return;
            }

            const targetGain = (ccVal / 127);
            const now = this.ctx.currentTime;
            
            // 【対策2】時定数を 0.005 から 0.008秒（8ms）に調整
            // Linuxでのバッファサイズ調整と同様に、ブラウザの処理落ち（プツプツ音）を完全に吸収するマージンを確保
            for (let [origNote, voice] of this.activeVoices) {
                voice.gainNode.gain.setTargetAtTime(targetGain, now, 0.008);
            }
        }
    }

    noteOn(origNote, transposedNote, velocity) {
        // 息が閾値以下なら発音自体をスキップ（ゴーストノート・バウンスの徹底ガード）
        if (this.currentCc2 <= this.BREATH_THRESHOLD) return;

        if (this.activeVoices.has(origNote)) {
            this.noteOff(origNote);
        }

        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gainNode = this.ctx.createGain();

        if (this.currentProgram >= 64 && this.currentProgram <= 79) {
            osc.type = (this.currentProgram === 73) ? 'triangle' : 'sawtooth';
            filter.type = 'lowpass';
            // 物理管楽器の特性に合わせ高域を少し丸めることでアタックのクリックノイズを相殺
            filter.frequency.setValueAtTime(3200, this.ctx.currentTime); 
        } else if (this.currentProgram >= 80) {
            osc.type = 'square';
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(4000, this.ctx.currentTime);
        } else {
            osc.type = 'triangle';
        }

        const freq = 440 * Math.pow(2, (transposedNote - 69) / 12);
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        const initialGain = (velocity / 127) * (this.currentCc2 / 127);
        
        // 立ち上がりアタックバッファの平滑化 (5ms)
        gainNode.gain.setValueAtTime(0, this.ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(initialGain, this.ctx.currentTime + 0.005);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.masterGain);
        osc.start();

        this.activeVoices.set(origNote, { osc: osc, gainNode: gainNode });
    }

    noteOff(origNote) {
        if (this.activeVoices.has(origNote)) {
            const voice = this.activeVoices.get(origNote);
            const now = this.ctx.currentTime;
            
            try {
                // リリース時のパケットドロップによる「音残り」を消すため、
                // キャンセル処理を入れて確実に10ミリ秒で指数関数減衰（消音）させる
                voice.gainNode.gain.cancelScheduledValues(now);
                voice.gainNode.gain.setValueAtTime(voice.gainNode.gain.value, now);
                voice.gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.01);
                voice.osc.stop(now + 0.015);
            } catch(e) {}
            
            this.activeVoices.delete(origNote);
        }
    }

    // 息が止まったときに呼び出される全ミュートマクロ
    allNotesOff() {
        const now = this.ctx.currentTime;
        for (let [origNote, voice] of this.activeVoices) {
            try {
                voice.gainNode.gain.cancelScheduledValues(now);
                voice.gainNode.gain.setValueAtTime(0, now);
                voice.osc.stop(now);
            } catch(e) {}
        }
        this.activeVoices.clear();
    }
}

// ============================================================================
// アプリケーション UI / MIDI 制御ロジック
// ============================================================================
const engine = new EWISoundFontEngine();
let audioCtx = null;
let transposeOffset = 0;
const noteNames = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];

window.addEventListener('DOMContentLoaded', () => {
    initTransposeSelect();
    setupUIEventListeners();
});

function initTransposeSelect() {
    const select = document.getElementById('transpose-select');
    for (let i = -11; i <= 11; i++) {
        const option = document.createElement('option');
        option.value = i;
        let noteIndex = (i % 12 + 12) % 12;
        let sign = i > 0 ? "+" : "";
        option.textContent = `${sign}${i}: ${noteNames[noteIndex]}`;
        if (i === 0) option.selected = true;
        select.appendChild(option);
    }
}

function setupUIEventListeners() {
    document.getElementById('transpose-select').addEventListener('change', (e) => {
        transposeOffset = parseInt(e.target.value, 10);
    });

    const volSlider = document.getElementById('volume-slider');
    volSlider.addEventListener('input', (e) => {
        const vol = parseFloat(e.target.value);
        document.getElementById('volume-val').textContent = `${Math.round(vol * 100)}%`;
        engine.setVolume(vol);
    });

    document.getElementById('instrument-select').addEventListener('change', (e) => {
        engine.setProgram(parseInt(e.target.value, 10));
    });

    document.getElementById('sf2-file').addEventListener('change', handleFileSelect);
}

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    updateStatus(`[${file.name}] バッファ最適化展開中...`, "info");
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            
            // Linuxのオーディオバッファ調整に相当する設定：
            // latencyHintに 'interactive' を指定しつつ、ブラウザに最短のハードウェア同調を要求
            audioCtx = new AudioContext({ latencyHint: 'interactive' }); 

            engine.init(audioCtx, e.target.result);
            document.getElementById('instrument-select').disabled = false;

            if (navigator.requestMIDIAccess) {
                const midiAccess = await navigator.requestMIDIAccess();
                initMIDI(midiAccess);
            } else {
                updateStatus("Web MIDI API非対応環境です。", "error");
            }
        } catch (err) {
            updateStatus("初期化失敗: " + err.message, "error");
        }
    };
    reader.readAsArrayBuffer(file);
}

function initMIDI(midiAccess) {
    const inputs = midiAccess.inputs.values();
    let hasInputs = false;
    for (let input of inputs) {
        input.onmidimessage = handleMIDIMessage;
        hasInputs = true;
        updateStatus(`バッファ最適化システム稼働中。[Device: ${input.name}]`, "success");
    }
    if (!hasInputs) updateStatus("SoundFontデコード成功。EWIをUSB接続してください。", "info");
}

function handleMIDIMessage(event) {
    const data = event.data;
    const cmd = data[0] >> 4;
    const note = data[1];
    const velocity = data[2];

    if (cmd === 9 && velocity > 0) {
        engine.noteOn(note, note + transposeOffset, velocity);
    } else if (cmd === 8 || (cmd === 9 && velocity === 0)) {
        engine.noteOff(note);
    } else if (cmd === 11) {
        engine.handleCC(data[1], data[2]);
    }
}

function updateStatus(text, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.textContent = text;
    statusDiv.className = `status ${type}`;
}
</script>
</body>
</html>
