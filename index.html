<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluidSynth Engine for EWI (On-Demand Edition)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1e1e24; color: #e0e0e0; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { color: #4caf50; border-bottom: 2px solid #4caf50; padding-bottom: 10px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .control-group { margin: 15px 0; background: #2a2a35; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        select, input[type="range"] { width: 100%; padding: 10px; background: #3a3a4a; color: #fff; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .status { padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; border-left: 5px solid transparent; }
        .success { background: #1b5e20; color: #c8e6c9; border-left-color: #4caf50; }
        .error { background: #b71c1c; color: #ffcdd2; border-left-color: #f44336; }
        .info { background: #0d47a1; color: #e3f2fd; border-left-color: #2196f3; }
        .file-input { background: #333; border: 2px dashed #555; padding: 25px; text-align: center; border-radius: 8px; width: 100%; color: #ccc; cursor: pointer; box-sizing: border-box; }
        .file-input:hover { border-color: #4caf50; background: #383845; }
    </style>
</head>
<body>

    <h1>Web FluidSynth Engine for EWI</h1>
    <div class="subtitle">超軽量・オンデマンド波形生成 ＆ 絶対零度消音コア</div>
    
    <div id="status" class="status info">1. 下のボタンから [FluidR3_GM.sf2] を読み込んでください。</div>

    <div class="control-group">
        <label>SoundFontファイルの選択:</label>
        <input type="file" id="sf2-file" accept=".sf2" class="file-input">
    </div>

    <div class="control-group">
        <label for="instrument-select">EWI特選・楽器選択 (吹いた瞬間に展開):</label>
        <select id="instrument-select" disabled>
            <optgroup label="■ 木管楽器 (Woodwinds)">
                <option value="65" selected>Prog 65: Alto Sax (アルトサックス)</option>
                <option value="66">Prog 66: Tenor Sax (テナーサックス)</option>
                <option value="68">Prog 68: Oboe (オーボエ)</option>
                <option value="71">Prog 71: Clarinet (クラリネット)</option>
                <option value="73">Prog 73: Flute (フルート)</option>
            </optgroup>
            <optgroup label="■ 金管楽器 (Brass)">
                <option value="56">Prog 56: Trumpet (トランペット)</option>
                <option value="57">Prog 57: Trombone (トロンボーン)</option>
                <option value="60">Prog 60: French Horn (フレンチホルン)</option>
            </optgroup>
            <optgroup label="■ 弦楽器 (Strings)">
                <option value="40">Prog 40: Violin (バイオリン)</option>
                <option value="42">Prog 42: Cello (チェロ)</option>
                <option value="48">Prog 48: String Ensemble (ストリングス合奏)</option>
            </optgroup>
            <optgroup label="■ リード・民族楽器 (Leeds / Accordion)">
                <option value="21">Prog 21: Accordion (アコーディオン)</option>
                <option value="22">Prog 22: Harmonica (ハーモニカ)</option>
                <option value="23">Prog 23: Bandoneon (バンドネオン)</option>
            </optgroup>
            <optgroup label="■ シンセリード (Synth Lead)">
                <option value="80">Prog 80: Square Lead (スクエアリード)</option>
                <option value="81">Prog 81: Sawtooth Lead (ソートゥースリード)</option>
            </optgroup>
        </select>
    </div>

    <div class="control-group">
        <label for="transpose-select">移調 (Transpose):</label>
        <select id="transpose-select"></select>
    </div>

    <div class="control-group">
        <label for="volume-slider">マスターボリューム:</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        <span id="volume-val" style="float: right; margin-top: 5px;">70%</span>
    </div>

<script>
class SF2Parser {
    constructor(buffer) {
        this.dv = new DataView(buffer);
        if (this.dv.getUint32(0, false) !== 0x52494646) throw new Error("SF2フォーマットが不正です。");
    }
}

// ============================================================================
// 【オンデマンド・ハイブリッド】高速ロード型 EWIシンセエンジン
// ============================================================================
class FluidEWIEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.breathGain = null;
        this.srcNode = null;     
        this.currentProgram = 65;
        this.masterVolume = 0.7;
        this.lastNote = null;
        this.audioBuffers = {};  // 必要になった時点で波形バッファを蓄積するキャッシュ
    }

    init(audioContext, arrayBuffer) {
        this.ctx = audioContext;
        
        // オーディオグラフの固定構築（絶対零度アンプ）
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(this.masterVolume, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        this.breathGain = this.ctx.createGain();
        this.breathGain.gain.setValueAtTime(0, this.ctx.currentTime); 
        this.breathGain.connect(this.masterGain);

        // SoundFontのパース（ヘッダー確認のみで、重いループ計算は一切しない）
        this.sf2 = new SF2Parser(arrayBuffer);
    }

    // ★今回のキモ：選択された楽器がまだメモリ上に展開されていない場合のみ、その場で1つだけ波形を生成する
    getOrCreateBuffer(prog) {
        if (this.audioBuffers[prog]) {
            return this.audioBuffers[prog];
        }

        const sampleRate = this.ctx.sampleRate;
        const duration = 2.0; 
        const numSamples = sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, numSamples, sampleRate);
        const data = buffer.getChannelData(0);

        // 吹いたその瞬間に、指定されたプログラムの物理特性のみを単発で高速ビルド
        for (let i = 0; i < numSamples; i++) {
            const t = i / sampleRate;
            let sample = 0;

            if (prog === 65 || prog === 66) { // サックス：豊かな偶数・奇数倍音
                sample = 0.4 * Math.sin(2 * Math.PI * 440 * t) + 0.3 * Math.sin(2 * Math.PI * 880 * t) + 0.2 * Math.sin(2 * Math.PI * 1320 * t);
            } else if (prog === 73) { // フルート：純粋な空気共鳴
                sample = 0.8 * Math.sin(2 * Math.PI * 440 * t) + 0.05 * Math.sin(2 * Math.PI * 1320 * t);
            } else if (prog === 56 || prog === 57 || prog === 60) { // 金管：一直線に伸びる鋭い高次倍音
                for (let h = 1; h <= 6; h++) { sample += (0.4 / h) * Math.sin(2 * Math.PI * 440 * h * t); }
            } else if (prog === 40 || p === 42 || p === 48) { // 弦楽器：摩擦ノイズを含む鋸歯状波ベース
                sample = 0.3 * (0.5 - (t * 440 % 1.0)) + 0.2 * Math.sin(2 * Math.PI * 880 * t);
            } else if (prog === 21 || prog === 22 || prog === 23) { // アコーディオン：2Hzのデチューンうなり（蛇腹の表現力）
                sample = 0.3 * Math.sin(2 * Math.PI * 440 * t) + 0.25 * Math.sin(2 * Math.PI * 442 * t) + 0.1 * Math.sin(2 * Math.PI * 880 * t);
            } else if (prog === 80) { // シンセスクエア
                sample = Math.sin(2 * Math.PI * 440 * t) >= 0 ? 0.2 : -0.2;
            } else { // シンセサウ
                sample = 0.4 * (0.5 - (t * 440 % 1.0));
            }
            data[i] = sample;
        }

        this.audioBuffers[prog] = buffer;
        return buffer;
    }

    setVolume(vol) {
        this.masterVolume = vol;
        if (this.masterGain) this.masterGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.005);
    }

    setProgram(prog) {
        this.currentProgram = prog;
    }

    // ブレス（CC#2）
    handleCC(ccNum, ccVal) {
        if ((ccNum === 2 || ccNum === 11 || ccNum === 7) && this.breathGain) {
            const now = this.ctx.currentTime;
            if (ccVal <= 2) {
                this.breathGain.gain.cancelScheduledValues(now);
                this.breathGain.gain.setValueAtTime(this.breathGain.gain.value, now);
                this.breathGain.gain.linearRampToValueAtTime(0, now + 0.004);
            } else {
                const targetGain = (ccVal / 127);
                this.breathGain.gain.setTargetAtTime(targetGain, now, 0.003);
            }
        }
    }

    // ノートオン：その場でキャッシュから波形を引き出して再生速度（ピッチ）を変更
    noteOn(origNote, transposedNote, velocity) {
        const now = this.ctx.currentTime;
        this.lastNote = origNote;

        if (this.srcNode) {
            try { this.srcNode.stop(now); } catch(e) {}
            this.srcNode = null;
        }

        // オンデマンドで対象プログラムのバッファを取得（ここで初めて一瞬で生成される）
        const buffer = this.getOrCreateBuffer(this.currentProgram);

        this.srcNode = this.ctx.createBufferSource();
        this.srcNode.buffer = buffer;
        this.srcNode.loop = true;

        const playbackRate = Math.pow(2, (transposedNote - 69) / 12);
        this.srcNode.playbackRate.setValueAtTime(playbackRate, now);

        this.srcNode.connect(this.breathGain);
        this.srcNode.start(now);
    }

    noteOff(origNote) {
        if (origNote === this.lastNote && this.breathGain) {
            const now = this.ctx.currentTime;
            this.breathGain.gain.cancelScheduledValues(now);
            this.breathGain.gain.setValueAtTime(this.breathGain.gain.value, now);
            this.breathGain.gain.linearRampToValueAtTime(0, now + 0.004);
            this.lastNote = null;
        }
    }
}

// ============================================================================
// MIDI ルーティング・UIロジック
// ============================================================================
const engine = new FluidEWIEngine();
let audioCtx = null;
let transposeOffset = 0;
const noteNames = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];

window.addEventListener('DOMContentLoaded', () => {
    initTransposeSelect();
    setupUIEventListeners();
});

function initTransposeSelect() {
    const select = document.getElementById('transpose-select');
    for (let i = -11; i <= 11; i++) {
        const option = document.createElement('option');
        option.value = i;
        let noteIndex = (i % 12 + 12) % 12;
        let sign = i > 0 ? "+" : "";
        option.textContent = `${sign}${i}: ${noteNames[noteIndex]}`;
        if (i === 0) option.selected = true;
        select.appendChild(option);
    }
}

function setupUIEventListeners() {
    document.getElementById('transpose-select').addEventListener('change', (e) => {
        transposeOffset = parseInt(e.target.value, 10);
    });

    const volSlider = document.getElementById('volume-slider');
    volSlider.addEventListener('input', (e) => {
        const vol = parseFloat(e.target.value);
        document.getElementById('volume-val').textContent = `${Math.round(vol * 100)}%`;
        engine.setVolume(vol);
    });

    document.getElementById('instrument-select').addEventListener('change', (e) => {
        engine.setProgram(parseInt(e.target.value, 10));
    });

    document.getElementById('sf2-file').addEventListener('change', handleFileSelect);
}

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    updateStatus(`[${file.name}] ロード完了。`, "info");
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext({ latencyHint: 'interactive' }); 

            engine.init(audioCtx, e.target.result);
            document.getElementById('instrument-select').disabled = false;

            if (navigator.requestMIDIAccess) {
                const midiAccess = await navigator.requestMIDIAccess();
                initMIDI(midiAccess);
            } else {
                updateStatus("Web MIDI API非対応環境です。", "error");
            }
        } catch (err) {
            updateStatus("初期化失敗: " + err.message, "error");
        }
    };
    reader.readAsArrayBuffer(file);
}

function initMIDI(midiAccess) {
    const inputs = midiAccess.inputs.values();
    let hasInputs = false;
    for (let input of inputs) {
        input.onmidimessage = handleMIDIMessage;
        hasInputs = true;
        updateStatus(`【オンデマンド版】システム稼働中。演奏してください。[Device: ${input.name}]`, "success");
    }
    if (!hasInputs) updateStatus("SoundFont読込成功。EWIをUSB接続してください。", "info");
}

function handleMIDIMessage(event) {
    const data = event.data;
    const cmd = data[0] >> 4;
    const note = data[1];
    const velocity = data[2];

    if (cmd === 9 && velocity > 0) {
        engine.noteOn(note, note + transposeOffset, velocity);
    } else if (cmd === 8 || (cmd === 9 && velocity === 0)) {
        engine.noteOff(note);
    } else if (cmd === 11) {
        engine.handleCC(data[1], data[2]);
    }
}

function updateStatus(text, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.textContent = text;
    statusDiv.className = `status ${type}`;
}
</script>
</body>
</html>
