<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluidSynth PWA for EWI</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #1e1e24; color: #e0e0e0; padding: 20px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; min-height: 95vh; }
        h1 { color: #4caf50; border-bottom: 2px solid #4caf50; padding-bottom: 10px; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .control-group { margin: 15px 0; background: #2a2a35; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        select, input[type="range"] { width: 100%; padding: 10px; background: #3a3a4a; color: #fff; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .status { padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; border-left: 5px solid transparent; }
        .success { background: #1b5e20; color: #c8e6c9; border-left-color: #4caf50; }
        .info { background: #0d47a1; color: #e3f2fd; border-left-color: #2196f3; }
        footer { margin-top: auto; padding-top: 30px; font-size: 0.8rem; color: #666; text-align: center; border-top: 1px solid #333; }
        footer a { color: #888; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>FluidSynth EWI Engine</h1>
    <div class="subtitle">Wasmオーディオ並列駆動 ＆ プロ仕様PWAモデル</div>
    
    <div id="status" class="status info">1. [FluidR3_GM.sf2] ファイルを選択してください。</div>

    <div class="control-group">
        <label>SoundFontファイルのローカル選択:</label>
        <input type="file" id="sf2-file" accept=".sf2">
    </div>

    <div class="control-group">
        <label for="instrument-select">楽器（プリセット）選択:</label>
        <select id="instrument-select" disabled>
            <optgroup label="■ 木管楽器">
                <option value="65" selected>Prog 65: Alto Sax</option>
                <option value="66">Prog 66: Tenor Sax</option>
                <option value="68">Prog 68: Oboe</option>
                <option value="71">Prog 71: Clarinet</option>
                <option value="73">Prog 73: Flute</option>
            </optgroup>
            <optgroup label="■ 金管楽器">
                <option value="56">Prog 56: Trumpet</option>
                <option value="57">Prog 57: Trombone</option>
                <option value="60">Prog 60: French Horn</option>
            </optgroup>
            <optgroup label="■ 弦楽器 / リード">
                <option value="40">Prog 40: Violin</option>
                <option value="21">Prog 21: Accordion</option>
                <option value="22">Prog 22: Harmonica</option>
            </optgroup>
            <optgroup label="■ シンセリード">
                <option value="80">Prog 80: Square Lead</option>
                <option value="81">Prog 81: Sawtooth Lead</option>
            </optgroup>
        </select>
    </div>

    <div class="control-group">
        <label for="transpose-select">移調 (Transpose):</label>
        <select id="transpose-select"></select>
    </div>

    <script src="https://unpkg.com/js-synthesizer@1.0.11/dist/js-synthesizer.js"></script>
    <script src="./main.js"></script>
    <script>
        let synth = null;
        let transposeOffset = 0;

        // 移調の初期化
        const transposeSelect = document.getElementById('transpose-select');
        for (let i = -11; i <= 11; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = i >= 0 ? `+${i}` : i;
            if (i === 0) opt.selected = true;
            transposeSelect.appendChild(opt);
        }
        transposeSelect.addEventListener('change', (e) => transposeOffset = parseInt(e.target.value, 10));

        document.getElementById('sf2-file').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('status').className = "status info";
            document.getElementById('status').textContent = "FluidSynth Wasmコア初期化中...";

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext({ latencyHint: 'interactive' });

                // 本物のFluidSynth Wasmインスタンスの生成
                synth = new JSSynth.jsSynthesizer();
                
                // AudioWorklet（並列スレッド）の自動セットアップと、140MBバイナリの安全な流し込み
                await synth.init(audioCtx.sampleRate);
                
                const node = synth.createAudioNode(audioCtx);
                node.connect(audioCtx.destination);

                const buffer = await file.arrayBuffer();
                await synth.loadSoundFont(new Uint8Array(buffer));

                // プリセット初期化（サックス）
                await synth.programChange(0, 65);
                document.getElementById('instrument-select').disabled = false;

                // Web MIDI API 接続
                if (navigator.requestMIDIAccess) {
                    const midiAccess = await navigator.requestMIDIAccess();
                    for (let input of midiAccess.inputs.values()) {
                        input.onmidimessage = handleMIDIMessage;
                    }
                    document.getElementById('status').className = "status success";
                    document.getElementById('status').textContent = `【本物・低遅延稼働中】EWIを演奏してください。 [${input.name}]`;
                } else {
                    document.getElementById('status').textContent = "MIDIに対応していないブラウザです。";
                }
            } catch (err) {
                document.getElementById('status').className = "status error";
                document.getElementById('status').textContent = "起動エラー: " + err.message;
            }
        });

        function handleMIDIMessage(event) {
            if (!synth) return;
            const data = event.data;
            const status = data[0];
            const cmd = status & 0xF0;
            const chan = status & 0x0F;

            if (cmd === 0x90 && data[2] > 0) { // Note On
                synth.noteOn(chan, data[1] + transposeOffset, data[2]);
            } else if (cmd === 0x80 || (cmd === 0x90 && data[2] === 0)) { // Note Off
                synth.noteOff(chan, data[1]);
            } else if (cmd === 0xB0) { // CC (ブレス、ボリューム等のすべての連続可変値をFluidSynthコアへダイレクトスルー)
                synth.controlChange(chan, data[1], data[2]);
            }
        }

        document.getElementById('instrument-select').addEventListener('change', async (e) => {
            if (synth) await synth.programChange(0, parseInt(e.target.value, 10));
        });
    </script>

    <footer>
        <p>Powered by <a href="https://www.fluidsynth.org/" target="_blank">FluidSynth Core Engine</a> (Licensed under LGPL v2.1)</p>
        <p>Wasm Wrapper via <a href="https://github.com/jet2jet/js-synthesizer" target="_blank">js-synthesizer</a> (Copyright © jet2jet)</p>
    </footer>
</body>
</html>
